name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Versions agree
        run: npm run version-check
      - name: Unit tests
        run: npm run test:unit
      - name: Build
        run: npm run build
      - name: Bundle carries no line comments
        run: node -e "const s=require('fs').readFileSync('dist/content.js','utf8');if(/^\s*\/\//m.test(s))throw new Error('comment left in bundle')"
      - name: Package resolves every referenced file
        run: node scripts/package.mjs
      - name: Workflows and issue forms are valid
        run: |
          python -m pip install --quiet pyyaml
          python scripts/check-yaml.py

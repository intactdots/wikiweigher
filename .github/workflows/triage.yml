name: Triage

on:
  issues:
    types: [opened]

permissions:
  contents: read

jobs:
  needs-diagnostics:
    if: "!contains(github.event.issue.body, 'wikiweigher-report/1')"
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.issue.number }}
        run: |
          gh issue edit "$NUMBER" --add-label "needs-diagnostics"
          gh issue comment "$NUMBER" --body "Thanks for the report. The Diagnostics section was not generated by the extension, so some of what is needed to reproduce this is missing.

          Open Wikiweigher's settings, go to **Support**, expand **What gets sent**, press **Copy**, and paste the result into the Diagnostics section above. It carries no page address and nothing that identifies you."
